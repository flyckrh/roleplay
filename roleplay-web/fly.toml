app = "nju-roleplay-demo"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "4177"
  DATA_DIR = "/data"

[http_service]
  internal_port = 4177
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "roleplay_data"
  destination = "/data"
